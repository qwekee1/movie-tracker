<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do Watch</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        :root {
            --bg-color: #E8E8E8;
            --col-bg: #FFFFFF;
            --col-text: #121212;
            --card-bg: #DCDCDC;
            --card-text: #121212;
            --sub-text: rgba(0, 0, 0, 0.2);
            --header-sub: rgba(0, 0, 0, 0.4);
            --rating-green: #28a745;
            --rating-gray: rgba(128, 128, 128, 0.25);
            --danger: #ff4d4d;
        }

        html[data-theme="dark"] {
            --bg-color: #0f0f0f;
            --col-bg: #222222;
            --col-text: #ffffff;
            --card-bg: #333333;
            --card-text: #ffffff;
            --sub-text: rgb(255 255 255 / 40%);
            --header-sub: rgb(255 255 255 / 40%);
            --rating-green: #4cd964;
            --rating-gray: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gilroy', 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color); 
            color: var(--col-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* Поиск */
        .search-container { width: 100%; max-width: 1240px; margin-bottom: 30px; display: flex; }
        .search-input {
            width: 100%; background-color: var(--col-bg); border: none; padding: 18px 30px;
            border-radius: 50px; color: var(--col-text); font-size: 16px; outline: none; user-select: text;
        }

        /* Доска */
        .board { display: flex; gap: 30px; width: 100%; max-width: 1240px; margin-bottom: 30px; justify-content: center; }
        .column {
            background-color: var(--col-bg); flex: 1; max-width: 600px; height: 720px;
            border-radius: 30px; padding: 30px 20px; display: flex; flex-direction: column; transition: background-color 0.3s ease;
        }
        .column-header { color: var(--col-text); font-size: 22px; font-weight: bold; margin-bottom: 25px; text-align: center; display: flex; justify-content: center; gap: 8px; }
        .count-badge { color: var(--header-sub); font-weight: 500; }

        .task-list { 
            width: 100%; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none;
        }
        .task-list::-webkit-scrollbar { display: none; }

        .card {
            flex-shrink: 0;
            background-color: var(--card-bg); color: var(--card-text); padding: 16px 25px;
            border-radius: 50px; font-size: 16px; font-weight: 600; display: flex; align-items: center;
            position: relative; overflow: hidden; cursor: grab; transition: opacity 0.3s, transform 0.2s;
        }
        .card-number { color: var(--sub-text); font-size: 13px; width: 35px; flex-shrink: 0; }
        .card-title { flex-grow: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
        
        .rating-wrapper { display: flex; align-items: center; gap: 2px; width: 100px; justify-content: flex-end; flex-shrink: 0; }
        .star-svg { width: 14px; height: 14px; flex-shrink: 0; }

        /* Кнопки */
        .controls { display: flex; gap: 12px; width: 100%; max-width: 600px; margin-bottom: 40px; }
        .btn {
            flex: 1; background-color: #FFFFFF; border: none; padding: 14px 20px;
            border-radius: 50px; font-size: 16px; font-weight: bold; color: #121212;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }

        /* Модалки */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .modal-overlay.is-open { opacity: 1; visibility: visible; }
        .modal-content { background-color: var(--col-bg); width: 450px; padding: 35px; border-radius: 30px; display: flex; flex-direction: column; color: var(--col-text); }

        /* Корзина */
        #trash-content { max-height: 350px; overflow-y: auto; margin-bottom: 20px; scrollbar-width: none; }
        #trash-content::-webkit-scrollbar { display: none; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; background: rgba(128,128,128,0.1); padding: 15px 25px; border-radius: 20px; }
        
        #trash-content .settings-row { 
            border-radius: 50px; 
            margin-bottom: 8px; 
            padding: 10px 25px; 
        }

        /* Остальное */
        .btn-hold { background-color: var(--danger) !important; color: white !important; position: relative; overflow: hidden; }
        .btn-hold .fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background-color: rgba(255, 255, 255, 0.3); transition: width 0.1s linear; }
        .btn-hold.holding .fill { width: 100%; transition: width 0.8s linear; }

        #context-menu {
            position: fixed; background: #222; border-radius: 18px; padding: 8px; width: 200px; display: none; z-index: 3000; border: 1px solid rgba(255,255,255,0.1);
        }
        .menu-item { padding: 12px 16px; color: #fff; font-size: 15px; cursor: pointer; border-radius: 12px; }
        .menu-item:hover { background: #333; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4cd964; }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>

    <svg style="width:0; height:0; position:absolute;">
        <defs>
            <linearGradient id="half-star-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="50%" stop-color="var(--rating-green)" />
                <stop offset="50%" stop-color="var(--rating-gray)" />
            </linearGradient>
        </defs>
    </svg>

    <div class="search-container">
        <input type="text" id="global-search" class="search-input" placeholder="Поиск по фильмам..." oninput="handleSearch()">
    </div>

    <div class="board">
        <div class="column" id="zone-watchlist"><h2 class="column-header">Просмотреть <span class="count-badge">0</span></h2><div class="task-list"></div></div>
        <div class="column" id="zone-watched"><h2 class="column-header">Просмотрено <span class="count-badge">0</span></h2><div class="task-list"></div></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="openModal('edit-modal')">Добавить</button>
        <button class="btn" onclick="openModal('trash-modal')">Корзина</button>
        <button class="btn" onclick="openModal('settings-modal')">Настройки</button>
    </div>

    <div class="modal-overlay" id="auth-modal" style="background-color: rgba(0, 0, 0, 0.95);">
        <div class="modal-content" style="text-align: center; max-width: 400px; padding: 40px 30px;">
            <h2 style="margin-bottom: 15px;">Синхронизация</h2>
            <p style="margin-bottom: 25px; font-size: 15px; color: var(--header-sub);">Создайте профиль или введите готовый 5-значный код.</p>

            <div style="background: rgba(128,128,128,0.1); padding: 20px; border-radius: 25px; margin-bottom: 15px;">
                <h4 style="margin-bottom: 15px; font-size: 16px;">Новый профиль</h4>
                <input type="text" id="auth-name" placeholder="Ваше имя..." class="search-input" style="margin-bottom: 15px; text-align: center;">
                <button class="btn" style="width: 100%;" onclick="createNewProfile()">Создать профиль</button>
            </div>

            <div style="background: rgba(128,128,128,0.1); padding: 20px; border-radius: 25px;">
                <h4 style="margin-bottom: 15px; font-size: 16px;">Уже есть код?</h4>
                <input type="text" id="auth-key" placeholder="Пример: 50S4L" maxlength="5" class="search-input" style="margin-bottom: 15px; text-align: center; text-transform: uppercase;">
                <button class="btn" style="width: 100%;" onclick="loginWithKey()">Войти по коду</button>
            </div>
            
            <div id="auth-status" style="margin-top: 20px; font-size: 14px; font-weight: bold; min-height: 20px;"></div>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal" onclick="closeOnOverlay(event)">
        <div class="modal-content">
            <h3 id="modal-title" style="text-align:center; margin-bottom:20px;">Добавить фильм</h3>
            <input type="text" id="movie-input" 
                   style="background:rgba(128,128,128,0.1); border:none; padding:15px; border-radius:15px; color:inherit; margin-bottom:20px; outline:none; user-select: text;" 
                   placeholder="Название..."
                   onkeydown="if(event.key === 'Enter') saveMovie()">
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#DCDCDC;" onclick="closeModal('edit-modal')">Отмена</button>
                <button class="btn" onclick="saveMovie()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="trash-modal" onclick="closeOnOverlay(event)">
        <div class="modal-content">
            <h3 style="text-align:center; margin-bottom:20px;">Корзина</h3>
            <div id="trash-content"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#DCDCDC;" onclick="closeModal('trash-modal')">Назад</button>
                <button class="btn btn-hold" id="clear-btn">
                    <div class="fill" id="clear-fill"></div>
                    <span style="position: relative; z-index: 2;">Очистить всё</span>
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal" onclick="closeOnOverlay(event)">
        <div class="modal-content">
            <h3 style="text-align:center; margin-bottom:20px;">Настройки</h3>
            
            <div style="background: rgba(128,128,128,0.1); padding: 15px 25px; border-radius: 25px; margin-bottom: 15px;">
                <div style="font-weight: 600; margin-bottom: 12px; text-align: center; color: var(--header-sub); font-size: 14px;">Код доступа</div>
                <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center;">
                    <input type="text" id="settings-sync-key" readonly style="flex: 1; min-width: 0; background: var(--card-bg); border: none; padding: 12px 15px; border-radius: 50px; color: inherit; outline: none; text-align: center; font-weight: bold; font-size: 15px; letter-spacing: 2px;">
                    <button class="btn" style="padding: 12px 20px; flex: 0 0 auto; white-space: nowrap;" onclick="copySettingsKey()">Копировать</button>
                </div>
                <button class="btn" style="width: 100%; background-color: var(--danger); color: white;" onclick="logoutProfile()">Выйти из профиля</button>
            </div>

            <div style="background: rgba(128,128,128,0.1); padding: 15px 25px; border-radius: 25px; margin-bottom: 15px;">
                <div style="font-weight: 600; margin-bottom: 12px; text-align: center; color: var(--header-sub); font-size: 14px;">Бекап</div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="exportData()">Экспорт</button>
                    <button class="btn" onclick="document.getElementById('import-input').click()">Импорт</button>
                </div>
                <input type="file" id="import-input" style="display:none" accept=".json" onchange="importData(event)">
            </div>

            <div class="settings-row" style="margin-bottom:20px;">
                <span>Темная тема</span>
                <label class="switch"><input type="checkbox" id="theme-checkbox" onchange="toggleTheme()"><span class="slider"></span></label>
            </div>
            
            <button class="btn" style="background:#DCDCDC;" onclick="closeModal('settings-modal')">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="rating-modal" onclick="closeOnOverlay(event)">
        <div class="modal-content">
            <h3 style="text-align:center; margin-bottom:20px;">Установить рейтинг</h3>
            <div class="rating-picker" id="picker-container" style="display:flex; justify-content:center; gap:8px; margin-bottom:10px;"></div>
            <div id="rating-display" style="text-align:center; font-size:24px; font-weight:bold; margin-bottom:25px; color:var(--rating-green)">0.0</div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:var(--danger); color:white;" onclick="removeRating()">Убрать</button>
                <button class="btn" onclick="saveRating()">Готово</button>
            </div>
        </div>
    </div>

    <div id="context-menu">
        <div class="menu-item" onclick="editCurrent()">Редактировать</div>
        <div class="menu-item" onclick="openRating()">Рейтинг</div>
        <div class="menu-item" onclick="copyCurrent()">Копировать</div>
        <div class="menu-item" style="color:#ff4d4d" onclick="deleteCurrent()">В корзину</div>
    </div>

    <script>
        const starPath = "M29.895,12.52c-0.235-0.704-0.829-1.209-1.549-1.319l-7.309-1.095l-3.29-6.984C17.42,2.43,16.751,2,16,2 s-1.42,0.43-1.747,1.122l-3.242,6.959l-7.357,1.12c-0.72,0.11-1.313,0.615-1.549,1.319c-0.241,0.723-0.063,1.507,0.465,2.046 l5.321,5.446l-1.257,7.676c-0.125,0.767,0.185,1.518,0.811,1.959c0.602,0.427,1.376,0.469,2.02,0.114l6.489-3.624l6.581,3.624 c0.646,0.355,1.418,0.311,2.02-0.114c0.626-0.441,0.937-1.192,0.811-1.959l-1.259-7.686l5.323-5.436 C29.958,14.027,30.136,13.243,29.895,12.52z";
        let dragItem = null, avatar = null, shiftX, shiftY, contextTarget = null;
        let deletedMovies = JSON.parse(localStorage.getItem('deletedMovies')) || [];
        let holdTimer, cloudTimer, currentPickerValue = 0;

        // --- АВТОРИЗАЦИЯ И СИНХРОНИЗАЦИЯ ---

        function generateShortCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 5; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function showAuthStatus(msg, isError = false) {
            const el = document.getElementById('auth-status');
            el.textContent = msg;
            el.style.color = isError ? 'var(--danger)' : 'var(--rating-green)';
        }

        async function createNewProfile() {
            const nameInput = document.getElementById('auth-name').value.trim();
            const cleanName = nameInput.replace(/[^a-zA-Zа-яА-Я0-9_-]/g, '');
            if (!cleanName) return showAuthStatus('Пожалуйста, введите имя', true);

            const code = generateShortCode();
            localStorage.setItem('syncKey', code);
            localStorage.setItem('syncName', cleanName);
            
            alert(`Ваш личный код доступа:\n\n${code}\n\nОбязательно сохраните его! Вы также сможете скопировать его в Настройках.`);
            
            document.getElementById('auth-modal').classList.remove('is-open');
            refreshUI(true); // Сохраняем начальный файл в облако
        }

        async function loginWithKey() {
            const key = document.getElementById('auth-key').value.trim().toUpperCase();
            if (!key || key.length !== 5) return showAuthStatus('Введите корректный 5-значный код', true);

            showAuthStatus('Ищем профиль в облаке...');
            
            try {
                const res = await fetch(`/api/load?key=${key}`);
                if (res.status === 404) return showAuthStatus('Профиль не найден. Проверьте код.', true);
                if (!res.ok) throw new Error();
                
                const cloudData = await res.json();
                localStorage.setItem('syncKey', key);
                localStorage.setItem('syncName', cloudData.userName || 'User');
                localStorage.setItem('boardData', JSON.stringify(cloudData.boardData));
                localStorage.setItem('deletedMovies', JSON.stringify(cloudData.deletedMovies || []));
                
                showAuthStatus('Успешно! Синхронизируем...', false);
                setTimeout(() => location.reload(), 800);
            } catch (e) {
                showAuthStatus('Ошибка сети. Попробуйте позже.', true);
            }
        }

        async function pushToCloud(boardData, deletedList) {
            const key = localStorage.getItem('syncKey');
            const userName = localStorage.getItem('syncName') || 'User';
            if (!key) return; 

            try {
                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, userName, boardData, deletedMovies: deletedList })
                });
            } catch (e) { console.error('Сбой фонового сохранения в облако', e); }
        }

        function copySettingsKey() {
            const key = document.getElementById('settings-sync-key').value;
            if (key) {
                navigator.clipboard.writeText(key);
                alert('Код скопирован в буфер обмена!');
            }
        }

        function logoutProfile() {
            if (confirm("Вы уверены, что хотите выйти? Убедитесь, что вы записали свой код!")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- ИНТЕРФЕЙС И ЛОГИКА ---

        function createCard(title, rating = "0") {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span class="card-number"></span><span class="card-title">${title}</span>${getStarsHTML(rating)}`;
            card.addEventListener('mousedown', onMouseDown);
            return card;
        }

        function saveMovie() {
            const val = document.getElementById('movie-input').value.trim();
            if (val) {
                if (contextTarget) contextTarget.querySelector('.card-title').textContent = val;
                else document.getElementById('zone-watchlist').querySelector('.task-list').prepend(createCard(val, "0"));
                closeModal('edit-modal');
                refreshUI(true);
            }
        }

        function openModal(id) {
            const input = document.getElementById('movie-input');
            if (id === 'trash-modal') renderTrash();
            if (id === 'edit-modal') {
                if (!contextTarget) { input.value = ''; document.getElementById('modal-title').textContent = "Добавить фильм"; }
                setTimeout(() => input.focus(), 100);
            }
            if (id === 'settings-modal') {
                document.getElementById('settings-sync-key').value = localStorage.getItem('syncKey') || '';
            }
            document.getElementById(id).classList.add('is-open');
        }

        function closeModal(id) { 
            document.getElementById(id).classList.remove('is-open'); 
            if (id === 'edit-modal') contextTarget = null; 
        }

        function closeOnOverlay(e) { 
            if (e.target.classList.contains('modal-overlay') && e.target.id !== 'auth-modal') closeModal(e.target.id); 
        }

        function renderTrash() {
            const container = document.getElementById('trash-content');
            container.innerHTML = deletedMovies.length ? '' : '<p style="text-align:center; opacity:0.5; padding:20px;">Корзина пуста</p>';
            deletedMovies.forEach((m, i) => {
                const div = document.createElement('div');
                div.className = "settings-row";
                div.innerHTML = `<span style="text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:260px; font-weight:600;">${m}</span><span style="cursor:pointer; font-size:22px;" onclick="restore(${i})">↩</span>`;
                container.appendChild(div);
            });
        }

        // --- РЕЙТИНГ ---
        function initPicker() {
            const container = document.getElementById('picker-container');
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const unit = document.createElement('div');
                unit.style.cssText = "position:relative; width:42px; height:42px; cursor:pointer;";
                unit.innerHTML = `<div style="position:absolute;top:0;left:0;width:50%;height:100%;z-index:5" onmouseover="previewRating(${i-0.5})" onclick="selectRating(${i-0.5})"></div>
                    <div style="position:absolute;top:0;right:0;width:50%;height:100%;z-index:5" onmouseover="previewRating(${i})" onclick="selectRating(${i})"></div>
                    <svg viewBox="0 0 32 32" style="width:100%;height:100%"><path d="${starPath}" fill="var(--rating-gray)"/></svg>`;
                container.appendChild(unit);
            }
            container.onmouseleave = () => updatePickerStars(currentPickerValue);
        }
        function previewRating(val) { updatePickerStars(val); document.getElementById('rating-display').textContent = val.toFixed(1); }
        function selectRating(val) { currentPickerValue = val; updatePickerStars(val); }
        function updatePickerStars(val) {
            const stars = document.querySelectorAll('#picker-container svg path');
            stars.forEach((s, i) => {
                const idx = i + 1;
                if (val >= idx) s.setAttribute('fill', 'var(--rating-green)');
                else if (val > idx - 1) s.setAttribute('fill', 'url(#half-star-grad)');
                else s.setAttribute('fill', 'var(--rating-gray)');
            });
            document.getElementById('rating-display').textContent = val.toFixed(1);
        }
        function getStarsHTML(rating) {
            const num = parseFloat(rating) || 0;
            let html = '<div class="rating-wrapper">';
            for (let i = 1; i <= 5; i++) {
                let fill = (num >= i) ? "var(--rating-green)" : (num > i - 1 ? "url(#half-star-grad)" : "var(--rating-gray)");
                html += `<svg class="star-svg" viewBox="0 0 32 32"><path d="${starPath}" fill="${fill}"/></svg>`;
            }
            return html + `<span style="display:none" class="raw-rating">${num}</span></div>`;
        }
        function openRating() { const raw = contextTarget.querySelector('.raw-rating'); currentPickerValue = raw ? parseFloat(raw.textContent) : 0; updatePickerStars(currentPickerValue); openModal('rating-modal'); }
        function saveRating() { if (contextTarget) { contextTarget.querySelector('.rating-wrapper').outerHTML = getStarsHTML(currentPickerValue); refreshUI(true); } closeModal('rating-modal'); }
        function removeRating() { currentPickerValue = 0; saveRating(); }
        
        // --- DRAG & DROP ---
        function onMouseDown(e) {
            if (e.which !== 1) return;
            const card = e.target.closest('.card'); if (!card) return;
            dragItem = card; const rect = dragItem.getBoundingClientRect();
            shiftX = e.clientX - rect.left; shiftY = e.clientY - rect.top;
            avatar = dragItem.cloneNode(true); avatar.classList.add('drag-avatar');
            avatar.style.cssText = `position:fixed; pointer-events:none; z-index:9999; opacity:0.9; box-shadow:0 10px 30px rgba(0,0,0,0.4); width:${dragItem.offsetWidth}px;`;
            document.body.appendChild(avatar); dragItem.classList.add('dragging');
            updateAvatarPos(e.clientX, e.clientY);
            document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);
        }
        function updateAvatarPos(x, y) { avatar.style.left = (x - shiftX) + 'px'; avatar.style.top = (y - shiftY) + 'px'; }
        function onMouseMove(e) {
            updateAvatarPos(e.clientX, e.clientY); avatar.style.display = 'none';
            const el = document.elementFromPoint(e.clientX, e.clientY); avatar.style.display = 'flex';
            const list = el?.closest('.task-list');
            if (list) {
                const draggables = [...list.querySelectorAll('.card:not(.dragging)')];
                const after = draggables.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = e.clientY - box.top - box.height / 2;
                    return (offset < 0 && offset > closest.offset) ? { offset: offset, element: child } : closest;
                }, { offset: Number.NEGATIVE_INFINITY }).element;
                after == null ? list.appendChild(dragItem) : list.insertBefore(dragItem, after);
                refreshUI(true);
            }
        }
        function onMouseUp() { if (avatar) avatar.remove(); if (dragItem) dragItem.classList.remove('dragging'); avatar = dragItem = null; document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); refreshUI(true); }
        
        // --- КОНТЕКСТНОЕ МЕНЮ И УТИЛИТЫ ---
        document.addEventListener('contextmenu', e => {
            const card = e.target.closest('.card');
            if (card) { e.preventDefault(); contextTarget = card; const menu = document.getElementById('context-menu'); menu.style.display = 'block'; menu.style.left = e.pageX + 'px'; menu.style.top = e.pageY + 'px'; }
        });
        document.addEventListener('click', () => document.getElementById('context-menu').style.display = 'none');
        
        function editCurrent() { document.getElementById('movie-input').value = contextTarget.querySelector('.card-title').textContent; document.getElementById('modal-title').textContent = "Редактировать"; openModal('edit-modal'); }
        function deleteCurrent() { deletedMovies.push(contextTarget.querySelector('.card-title').textContent); contextTarget.remove(); refreshUI(true); }
        function copyCurrent() { if (contextTarget) navigator.clipboard.writeText(contextTarget.querySelector('.card-title').textContent); }
        function restore(i) { const m = deletedMovies.splice(i, 1)[0]; document.getElementById('zone-watchlist').querySelector('.task-list').prepend(createCard(m, "0")); renderTrash(); refreshUI(true); }
        function toggleTheme() { const theme = document.getElementById('theme-checkbox').checked ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('theme', theme); }
        
        function handleSearch() {
            const q = document.getElementById('global-search').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                const title = c.querySelector('.card-title').textContent.toLowerCase();
                c.style.opacity = (!q || title.includes(q)) ? "1" : "0.1";
            });
        }
        
        const clearBtn = document.getElementById('clear-btn');
        clearBtn.addEventListener('mousedown', () => { clearBtn.classList.add('holding'); holdTimer = setTimeout(() => { deletedMovies = []; refreshUI(true); closeModal('trash-modal'); }, 800); });
        clearBtn.addEventListener('mouseup', () => { clearBtn.classList.remove('holding'); clearTimeout(holdTimer); });
        
        function exportData() { const blob = new Blob([JSON.stringify({ boardData: JSON.parse(localStorage.getItem('boardData')), deletedMovies })], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'backup.json'; a.click(); }
        function importData(e) { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { const data = JSON.parse(ev.target.result); localStorage.setItem('boardData', JSON.stringify(data.boardData)); localStorage.setItem('deletedMovies', JSON.stringify(data.deletedMovies)); location.reload(); }; reader.readAsText(file); }
        
        // --- ФУНКЦИИ РЕНДЕРА И ИНИЦИАЛИЗАЦИИ ---

        function loadBoardFromStorage() {
            const saved = JSON.parse(localStorage.getItem('boardData'));
            if (saved) {
                document.getElementById('zone-watchlist').querySelector('.task-list').innerHTML = '';
                document.getElementById('zone-watched').querySelector('.task-list').innerHTML = '';
                
                Object.keys(saved).forEach(z => {
                    const list = document.getElementById(z)?.querySelector('.task-list');
                    if(list) saved[z].forEach(obj => list.appendChild(createCard(obj.title, obj.rating)));
                });
            }
            refreshUI(false); // false означает: не отправлять данные в облако, мы их только что загрузили
        }

        // pushToCloudFlag определяет, нужно ли после обновления интерфейса запускать таймер отправки на сервер
        function refreshUI(pushToCloudFlag = true) {
            const data = {};
            document.querySelectorAll('.column').forEach(col => {
                const cards = col.querySelectorAll('.card:not(.dragging)');
                col.querySelector('.count-badge').textContent = cards.length;
                cards.forEach((c, i) => c.querySelector('.card-number').textContent = i + 1);
                data[col.id] = Array.from(cards).map(t => ({ title: t.querySelector('.card-title').textContent, rating: t.querySelector('.raw-rating')?.textContent || "0" }));
            });
            
            localStorage.setItem('boardData', JSON.stringify(data)); 
            localStorage.setItem('deletedMovies', JSON.stringify(deletedMovies));

            if (pushToCloudFlag) {
                clearTimeout(cloudTimer);
                cloudTimer = setTimeout(() => pushToCloud(data, deletedMovies), 600);
            }
        }

        window.onload = async () => {
            initPicker();
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('theme-checkbox').checked = (theme === 'dark');
            
            const key = localStorage.getItem('syncKey');
            
            // Если нет кода - показываем окно входа
            if (!key) {
                document.getElementById('auth-modal').classList.add('is-open');
                return; 
            }

            // 1. Моментально рисуем локальные данные (чтобы не было белого экрана)
            loadBoardFromStorage();

            // 2. В фоне стучимся в облако за свежими данными
            try {
                const res = await fetch(`/api/load?key=${key}`);
                if (res.ok) {
                    const cloudData = await res.json();
                    
                    // Перезаписываем локальную память свежими данными из облака
                    localStorage.setItem('boardData', JSON.stringify(cloudData.boardData));
                    deletedMovies = cloudData.deletedMovies || [];
                    localStorage.setItem('deletedMovies', JSON.stringify(deletedMovies));
                    
                    // Перерисовываем доску с новыми данными
                    loadBoardFromStorage();
                }
            } catch (e) {
                console.log('Работаем в оффлайн-режиме, нет сети для синхронизации');
            }
        };
    </script>
</body>
</html>
