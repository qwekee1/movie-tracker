<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do Watch</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #18181b;
            --bg-glass: rgba(24, 24, 27, 0.6);
            --border-glass: 1px solid rgba(255, 255, 255, 0.05);
            --accent: #10b981;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --danger: #e11d48;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Gilroy', 'Tilda Sans', sans-serif;
            -webkit-user-select: none; user-select: none;
        }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.8); }

        /* Всплывающие уведомления (Toast) */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translate(-50%, -20px);
            background: var(--accent); color: #000; padding: 16px 32px;
            border-radius: 16px; font-size: 16px; font-weight: 700;
            opacity: 0; visibility: hidden; transition: all 0.3s ease-out; z-index: 9999;
        }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

        /* Модальные окна */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 5000;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .modal-overlay.is-open { opacity: 1; visibility: visible; }
        
        .modal-box {
            background: var(--bg-card); padding: 40px; border-radius: 32px;
            width: 100%; max-width: 450px; text-align: center; border: var(--border-glass);
            position: relative;
        }
        .modal-box h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
        .modal-box p { color: var(--text-muted); font-size: 16px; margin-bottom: 30px; }
        
        .custom-input {
            width: 100%; padding: 20px 24px; font-size: 18px; background: #27272a;
            border: none; border-radius: 16px; color: #fff; margin-bottom: 20px;
            outline: none; text-align: center;
        }
        .auth-input { letter-spacing: 0.1em; text-transform: uppercase; font-size: 20px; }
        
        .action-btn {
            width: 100%; padding: 20px; background: var(--accent); color: #000;
            font-size: 20px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.9; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .close-modal {
            position: absolute; top: 20px; right: 20px; background: none; border: none;
            color: var(--text-muted); font-size: 24px; cursor: pointer;
        }

        /* Контейнер приложения */
        .app-container { width: 100%; max-width: 1240px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }

        /* Шапка */
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; height: 60px; position: relative; }
        .greeting { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.3s; }
        .greeting span.highlight { color: var(--accent); }

        /* Поиск */
        .search-container {
            display: flex; align-items: center; justify-content: flex-end; position: relative;
            width: 60px; height: 60px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-container.open { width: 100%; max-width: 400px; }
        
        .search-icon {
            position: absolute; right: 0; width: 60px; height: 60px; border-radius: 30px;
            background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: var(--border-glass); color: var(--text-main); display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 2; transition: background 0.3s ease; font-size: 20px;
        }
        .search-container.open .search-icon { background: transparent; border: none; pointer-events: none; right: auto; left: 10px; opacity: 0.5; }
        .search-input {
            width: 100%; height: 100%; background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: var(--border-glass); border-radius: 30px; color: var(--text-main);
            font-size: 16px; padding: 0 50px; outline: none; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .search-container.open .search-input { opacity: 1; pointer-events: auto; }
        .search-close {
            position: absolute; right: 20px; background: transparent; border: none; color: var(--text-main);
            opacity: 0; pointer-events: none; cursor: pointer; font-size: 18px; z-index: 3; transition: opacity 0.3s ease;
        }
        .search-container.open .search-close { opacity: 0.5; pointer-events: auto; }

        /* Доска */
        .board { display: flex; gap: 30px; width: 100%; align-items: flex-start; justify-content: center; }
        
        .column {
            background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: var(--border-glass); flex: 1; max-width: 500px; height: 70vh; min-height: 500px;
            border-radius: 32px; padding: 30px 20px; display: flex; flex-direction: column; position: relative;
        }
        
        .column-header {
            color: var(--text-main); font-size: 22px; font-weight: bold; margin-bottom: 25px;
            text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .count-badge { color: var(--text-muted); font-weight: 500; }

        .add-btn {
            background: rgba(255, 255, 255, 0.05); border: var(--border-glass); color: var(--text-main);
            width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s; position: absolute; right: 20px; top: 28px;
        }
        .add-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .task-list { width: 100%; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; }
        .task-list.drag-over { background: rgba(255, 255, 255, 0.02); border-radius: 20px; }

        .card {
            background: #27272a; border: var(--border-glass); border-radius: 20px;
            padding: 20px; display: flex; align-items: center; cursor: grab; transition: transform 0.2s, opacity 0.2s;
        }
        .card:active { cursor: grabbing; }
        .card.dragging { opacity: 0.5; transform: scale(0.95); }
        .card-color-tag { width: 6px; height: 40px; border-radius: 3px; margin-right: 15px; flex-shrink: 0; }
        .card-title { flex-grow: 1; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
        .delete-btn { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
        .card:hover .delete-btn { opacity: 1; }

        @media (max-width: 768px) {
            .app-container { padding: 20px 15px; }
            .board { flex-direction: column; align-items: center; }
            .column { width: 100%; height: 50vh; min-height: 400px; margin-bottom: 20px; }
            .top-bar.search-active .greeting { opacity: 0; pointer-events: none; position: absolute; }
            .top-bar.search-active .search-container { width: 100%; max-width: none; }
            .delete-btn { opacity: 1; } /* На мобилках крестик видно всегда */
        }
    </style>
</head>
<body>

    <!-- Всплывающее уведомление -->
    <div class="toast" id="toast"></div>

    <!-- Модалка авторизации -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <h2>Доступ закрыт</h2>
            <p>Введите ваш 5-значный код доступа.</p>
            <input type="text" class="custom-input auth-input" id="auth-code" placeholder="50S4L" maxlength="5">
            <button class="action-btn" id="auth-btn">Войти</button>
        </div>
    </div>

    <!-- Модалка добавления фильма -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-box">
            <button class="close-modal" id="close-add-modal">✖</button>
            <h2>Новый фильм</h2>
            <p>Что будем смотреть?</p>
            <input type="text" class="custom-input" id="new-movie-input" placeholder="Название фильма...">
            <button class="action-btn" id="save-movie-btn">Добавить</button>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div class="app-container">
        <div class="top-bar" id="top-bar">
            <div class="greeting">
                <span class="highlight">Привет,</span> <span id="user-display">Гость</span>
            </div>
            
            <div class="search-container" id="search-box">
                <div class="search-icon" id="search-open">🔍</div>
                <input type="text" class="search-input" id="search-input" placeholder="Найти фильм...">
                <button class="search-close" id="search-close">✖</button>
            </div>
        </div>

        <div class="board">
            <div class="column">
                <div class="column-header">
                    Буду смотреть <span class="count-badge" id="todo-count">0</span>
                    <button class="add-btn" id="open-add-modal">+</button>
                </div>
                <div class="task-list" id="todo-list" data-status="todo"></div>
            </div>

            <div class="column">
                <div class="column-header">
                    Просмотрено <span class="count-badge" id="watched-count">0</span>
                </div>
                <div class="task-list" id="watched-list" data-status="watched"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Состояние приложения (State) ---
        let movies = JSON.parse(localStorage.getItem('moviesState')) || [
            { id: '1', title: 'Интерстеллар', status: 'todo', color: '#10b981' },
            { id: '2', title: 'Дюна: Часть вторая', status: 'todo', color: '#3b82f6' },
            { id: '3', title: 'Начало', status: 'watched', color: '#a1a1aa' }
        ];

        // --- Уведомления ---
        let toastTimeout;
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${isError ? 'error' : ''}`;
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- Авторизация ---
        const authModal = document.getElementById('auth-modal');
        const authInput = document.getElementById('auth-code');
        const authBtn = document.getElementById('auth-btn');
        const userDisplay = document.getElementById('user-display');

        function checkAuth() {
            const savedCode = localStorage.getItem('appAccessCode');
            if (!savedCode) authModal.classList.add('is-open');
            else userDisplay.textContent = savedCode;
        }

        authInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
            authBtn.disabled = e.target.value.length !== 5;
        });

        authBtn.addEventListener('click', () => {
            const code = authInput.value.trim();
            if (code.length === 5) {
                localStorage.setItem('appAccessCode', code);
                authModal.classList.remove('is-open');
                userDisplay.textContent = code;
                showToast('Успешный вход!');
            } else {
                showToast('Код должен состоять из 5 символов', true);
            }
        });

        // --- Рендер и Логика карточек ---
        function saveState() {
            localStorage.setItem('moviesState', JSON.stringify(movies));
            renderBoard();
        }

        function createCardElement(movie) {
            const card = document.createElement('div');
            card.className = 'card';
            card.draggable = true;
            card.dataset.id = movie.id;
            
            if (movie.status === 'watched') card.style.opacity = '0.6';

            card.innerHTML = `
                <div class="card-color-tag" style="background: ${movie.color};"></div>
                <div class="card-title">${movie.title}</div>
                <button class="delete-btn" onclick="deleteMovie('${movie.id}')">✖</button>
            `;

            // Drag события
            card.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', movie.id);
                setTimeout(() => card.classList.add('dragging'), 0);
            });
            card.addEventListener('dragend', () => card.classList.remove('dragging'));

            return card;
        }

        function renderBoard(filterText = '') {
            const todoList = document.getElementById('todo-list');
            const watchedList = document.getElementById('watched-list');
            
            todoList.innerHTML = ''; watchedList.innerHTML = '';
            let todoCount = 0, watchedCount = 0;

            movies.forEach(movie => {
                if (filterText && !movie.title.toLowerCase().includes(filterText.toLowerCase())) return;

                const card = createCardElement(movie);
                if (movie.status === 'todo') {
                    todoList.appendChild(card);
                    todoCount++;
                } else {
                    watchedList.appendChild(card);
                    watchedCount++;
                }
            });

            document.getElementById('todo-count').textContent = todoCount;
            document.getElementById('watched-count').textContent = watchedCount;
        }

        // --- Drag and Drop Логика ---
        document.querySelectorAll('.task-list').forEach(list => {
            list.addEventListener('dragover', e => {
                e.preventDefault();
                list.classList.add('drag-over');
            });
            
            list.addEventListener('dragleave', () => list.classList.remove('drag-over'));
            
            list.addEventListener('drop', e => {
                e.preventDefault();
                list.classList.remove('drag-over');
                const id = e.dataTransfer.getData('text/plain');
                const newStatus = list.dataset.status;
                
                const movieIndex = movies.findIndex(m => m.id === id);
                if (movieIndex > -1 && movies[movieIndex].status !== newStatus) {
                    movies[movieIndex].status = newStatus;
                    movies[movieIndex].color = newStatus === 'watched' ? '#a1a1aa' : '#10b981'; // Меняем цвет при переносе
                    saveState();
                }
            });
        });

        // --- Добавление и удаление ---
        const addModal = document.getElementById('add-modal');
        const newMovieInput = document.getElementById('new-movie-input');
        
        document.getElementById('open-add-modal').addEventListener('click', () => {
            addModal.classList.add('is-open');
            setTimeout(() => newMovieInput.focus(), 100);
        });

        document.getElementById('close-add-modal').addEventListener('click', () => {
            addModal.classList.remove('is-open');
            newMovieInput.value = '';
        });

        document.getElementById('save-movie-btn').addEventListener('click', () => {
            const title = newMovieInput.value.trim();
            if (!title) {
                showToast('Введите название!', true);
                return;
            }
            
            movies.push({
                id: Date.now().toString(),
                title: title,
                status: 'todo',
                color: '#10b981'
            });
            
            addModal.classList.remove('is-open');
            newMovieInput.value = '';
            saveState();
            showToast('Фильм добавлен');
        });

        window.deleteMovie = function(id) {
            movies = movies.filter(m => m.id !== id);
            saveState();
            showToast('Удалено');
        };

        // --- Поиск ---
        const searchBox = document.getElementById('search-box');
        const searchInput = document.getElementById('search-input');
        const topBar = document.getElementById('top-bar');

        document.getElementById('search-open').addEventListener('click', () => {
            searchBox.classList.add('open');
            topBar.classList.add('search-active');
            setTimeout(() => searchInput.focus(), 300);
        });

        document.getElementById('search-close').addEventListener('click', () => {
            searchBox.classList.remove('open');
            topBar.classList.remove('search-active');
            searchInput.value = '';
            renderBoard();
        });

        searchInput.addEventListener('input', (e) => {
            renderBoard(e.target.value);
        });

        // Инициализация
        checkAuth();
        authBtn.disabled = true;
        renderBoard();
    </script>
</body>
</html>
