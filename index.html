<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tracker Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --col-bg: #E8E8E8;
            --col-text: #121212;
            --card-bg: #DCDCDC;
            --card-text: #121212;
            --sub-text: rgba(0, 0, 0, 0.2);
            --header-sub: rgba(0, 0, 0, 0.4);
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --col-bg: #222222;
            --col-text: #ffffff;
            --card-bg: #333333;
            --card-text: #ffffff;
            --sub-text: rgb(255 255 255 / 40%);
            --header-sub: rgb(255 255 255 / 40%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gilroy', 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color); 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .search-container {
            width: 100%;
            max-width: 1180px;
            margin-bottom: 30px;
            display: flex;
        }

        .search-input {
            width: 100%;
            background-color: var(--col-bg);
            border: 1px solid rgba(128,128,128,0.1);
            padding: 18px 30px;
            border-radius: 50px;
            color: var(--col-text);
            font-size: 16px;
            outline: none;
            user-select: text;
        }

        .board {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1180px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .column {
            background-color: var(--col-bg);
            flex: 1;
            max-width: 380px;
            height: 650px;
            border-radius: 30px;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        .column-header {
            color: var(--col-text);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            display: flex; justify-content: center; gap: 8px;
        }

        .task-list {
            width: 100%;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
        }

        .task-list::-webkit-scrollbar { display: none; }

        .card {
            background-color: var(--card-bg);
            color: var(--card-text);
            padding: 16px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: grab;
            transition: opacity 0.3s, transform 0.2s;
        }

        .card-number { color: var(--sub-text); font-size: 13px; margin-right: 12px; width: 20px; }
        .card-title { flex-grow: 1; text-align: center; margin-right: 20px; }
        .card:active { background-color: rgba(128, 128, 128, 0.1); }

        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }

        .btn {
            flex: 1;
            background-color: #FFFFFF;
            border: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            color: #121212;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); }

        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #fff; }
        input:checked + .slider:before { transform: translateX(24px); background-color: #121212; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.is-open { opacity: 1; pointer-events: auto; }
        .modal-content {
            background-color: #222; width: 450px; padding: 35px; border-radius: 30px;
            display: flex; flex-direction: column; color: white;
        }

        #context-menu {
            position: fixed; background: #222; border-radius: 18px; padding: 8px;
            width: 200px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: none; z-index: 3000;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .menu-item { padding: 12px 16px; color: #fff; font-size: 15px; cursor: pointer; border-radius: 12px; }
        .menu-item:hover { background: #333; }
    </style>
</head>
<body data-theme="light">

    <div class="search-container">
        <input type="text" id="global-search" class="search-input" placeholder="Поиск по фильмам..." oninput="handleSearch()">
    </div>

    <div class="board">
        <div class="column" id="zone-sorting"><h2 class="column-header">Сортировка <span class="count-badge">0</span></h2><div class="task-list"></div></div>
        <div class="column" id="zone-watchlist"><h2 class="column-header">Просмотреть <span class="count-badge">0</span></h2><div class="task-list"></div></div>
        <div class="column" id="zone-watched"><h2 class="column-header">Просмотрено <span class="count-badge">0</span></h2><div class="task-list"></div></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="openModal('edit-modal')">Добавить</button>
        <button class="btn" onclick="openModal('trash-modal')">Корзина</button>
        <button class="btn" onclick="openModal('settings-modal')">Настройки</button>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <h3 style="text-align:center; margin-bottom:20px;">Настройки</h3>
            <div style="display:flex; justify-content:space-between; align-items:center; background:#333; padding:18px 25px; border-radius:20px; margin-bottom:20px;">
                <span>Темная тема</span>
                <label class="switch"><input type="checkbox" id="theme-checkbox" onchange="toggleTheme()"><span class="slider"></span></label>
            </div>
            <button class="btn" style="background:#DCDCDC;" onclick="closeModal('settings-modal')">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="trash-modal">
        <div class="modal-content">
            <h3 style="text-align:center; margin-bottom:20px;">Корзина</h3>
            <div id="trash-content" style="max-height:300px; overflow-y:auto; margin-bottom:20px;"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#DCDCDC;" onclick="closeModal('trash-modal')">Назад</button>
                <button class="btn" style="background:#ff4d4d; color:white;" onclick="clearTrash()">Очистить всё</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="text-align:center; margin-bottom:20px;">Добавить фильм</h3>
            <input type="text" id="movie-input" style="background:#333; border:none; padding:15px; border-radius:15px; color:white; margin-bottom:20px; outline:none;" placeholder="Название...">
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#DCDCDC;" onclick="closeModal('edit-modal')">Отмена</button>
                <button class="btn" onclick="saveMovie()">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="context-menu">
        <div class="menu-item" onclick="editCurrent()">Редактировать</div>
        <div class="menu-item" style="color:#ff4d4d" onclick="deleteCurrent()">В корзину</div>
    </div>

    <script>
        let currentItem = null, avatar = null, shiftX, shiftY, contextTarget = null;
        let deletedMovies = JSON.parse(localStorage.getItem('deletedMovies')) || [];

        function openModal(id) { 
            if(id === 'trash-modal') renderTrash();
            document.getElementById(id).classList.add('is-open'); 
        }
        function closeModal(id) { document.getElementById(id).classList.remove('is-open'); }

        function toggleTheme() {
            const isDark = document.getElementById('theme-checkbox').checked;
            const theme = isDark ? 'dark' : 'light';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }

        function saveMovie() {
            const val = document.getElementById('movie-input').value.trim();
            if (!val) return;
            if (contextTarget) {
                contextTarget.querySelector('.card-title').textContent = val;
                contextTarget = null;
            } else {
                document.getElementById('zone-sorting').querySelector('.task-list').prepend(createCard(val));
            }
            document.getElementById('movie-input').value = '';
            closeModal('edit-modal'); refreshUI();
        }

        function createCard(title) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<span class="card-number"></span><span class="card-title">${title}</span>`;
            card.addEventListener('mousedown', onMouseDown);
            return card;
        }

        function renderTrash() {
            const container = document.getElementById('trash-content');
            container.innerHTML = deletedMovies.length ? '' : '<p style="text-align:center; color:#666;">Пусто</p>';
            deletedMovies.forEach((m, i) => {
                const div = document.createElement('div');
                div.style = "background:#444; padding:10px 20px; border-radius:50px; margin-bottom:8px; display:flex; justify-content:space-between;";
                div.innerHTML = `<span>${m}</span><span style="cursor:pointer; color:#fff" onclick="restore(${i})">↩</span>`;
                container.appendChild(div);
            });
        }

        function restore(i) {
            const m = deletedMovies.splice(i, 1)[0];
            document.getElementById('zone-sorting').querySelector('.task-list').prepend(createCard(m));
            renderTrash(); refreshUI();
        }

        function clearTrash() { deletedMovies = []; renderTrash(); refreshUI(); }

        function refreshUI() {
            const data = {};
            document.querySelectorAll('.column').forEach(col => {
                const cards = col.querySelectorAll('.card');
                col.querySelector('.count-badge').textContent = cards.length;
                cards.forEach((c, i) => c.querySelector('.card-number').textContent = i + 1);
                data[col.id] = Array.from(col.querySelectorAll('.card-title')).map(t => t.textContent);
            });
            localStorage.setItem('boardData', JSON.stringify(data));
            localStorage.setItem('deletedMovies', JSON.stringify(deletedMovies));
        }

        function handleSearch() {
            const q = document.getElementById('global-search').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                c.style.opacity = c.textContent.toLowerCase().includes(q) ? "1" : "0.1";
            });
        }

        // Drag & Drop (Упрощенный для стабильности)
        function onMouseDown(e) {
            if (e.which !== 1) return;
            currentItem = e.target.closest('.card');
            currentItem.style.opacity = '0.5';
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }
        function onMouseMove(e) {
            const zone = e.target.closest('.column');
            if (zone) {
                zone.querySelector('.task-list').appendChild(currentItem);
                refreshUI();
            }
        }
        function onMouseUp() {
            currentItem.style.opacity = '1';
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }

        document.addEventListener('contextmenu', e => {
            const card = e.target.closest('.card');
            if (card) {
                e.preventDefault(); contextTarget = card;
                const menu = document.getElementById('context-menu');
                menu.style.display = 'block'; menu.style.left = e.pageX + 'px'; menu.style.top = e.pageY + 'px';
            }
        });
        document.addEventListener('click', () => document.getElementById('context-menu').style.display = 'none');

        function editCurrent() { 
            document.getElementById('movie-input').value = contextTarget.querySelector('.card-title').textContent;
            openModal('edit-modal'); 
        }
        function deleteCurrent() { 
            deletedMovies.push(contextTarget.querySelector('.card-title').textContent);
            contextTarget.remove(); refreshUI(); 
        }

        window.onload = () => {
            const theme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', theme);
            document.getElementById('theme-checkbox').checked = (theme === 'dark');
            const saved = JSON.parse(localStorage.getItem('boardData'));
            if (saved) {
                Object.keys(saved).forEach(z => {
                    saved[z].forEach(t => document.getElementById(z).querySelector('.task-list').appendChild(createCard(t)));
                });
            }
            refreshUI();
        };
    </script>
</body>
</html>
