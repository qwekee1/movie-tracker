<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do Watch</title>
    <style>
        /* Подключение локальных шрифтов Gilroy */
        @font-face {
            font-family: 'Gilroy';
            src: url('./fonts/Gilroy-Regular.ttf') format('truetype');
            font-weight: 400; font-style: normal;
        }
        @font-face {
            font-family: 'Gilroy';
            src: url('./fonts/Gilroy-Medium.ttf') format('truetype');
            font-weight: 500; font-style: normal;
        }
        @font-face {
            font-family: 'Gilroy';
            src: url('./fonts/Gilroy-Semibold.ttf') format('truetype');
            font-weight: 600; font-style: normal;
        }
        @font-face {
            font-family: 'Gilroy';
            src: url('./fonts/Gilroy-Bold.ttf') format('truetype');
            font-weight: 700; font-style: normal;
        }

        :root {
            --bg-main: #09090b;
            --bg-btn: #18181b99;
            --border-glass: 1px solid rgba(255, 255, 255, 0.05);
            --radius-main: 20px;
            --accent: #10b981;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --danger: #ef4444;
            --rating-green: #10b981;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Gilroy', sans-serif;
            -webkit-user-select: none; user-select: none;
        }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden; padding: 20px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* Шапка */
        .app-header {
            width: 100%; max-width: 1200px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 40px;
            flex-wrap: wrap; gap: 15px;
        }

        .greeting {
            font-size: 32px; font-weight: 700; letter-spacing: -0.02em;
        }
        .greeting span { color: var(--accent); }

        .header-controls {
            display: flex; gap: 12px; align-items: center;
        }

        /* Поиск */
        .search-container {
            display: flex; align-items: center;
            background: var(--bg-btn); border: var(--border-glass);
            border-radius: var(--radius-main); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            overflow: hidden; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 130px; height: 56px;
        }
        .search-container.expanded { width: 300px; }
        
        .search-trigger {
            background: transparent; border: none; color: var(--text-main);
            display: flex; align-items: center; gap: 10px; padding: 0 20px;
            height: 100%; cursor: pointer; font-size: 16px; font-weight: 600; flex-shrink: 0;
        }
        .search-trigger svg { width: 20px; height: 20px; }
        .search-container.expanded .search-trigger span { display: none; }
        
        .search-input {
            background: transparent; border: none; color: var(--text-main);
            height: 100%; width: 100%; outline: none; font-size: 16px;
            padding-right: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .search-container.expanded .search-input { opacity: 1; pointer-events: auto; }

        /* Кнопки */
        .btn {
            background: var(--bg-btn); border: var(--border-glass);
            border-radius: var(--radius-main); color: var(--text-main);
            padding: 16px 24px; font-size: 16px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: all 0.2s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .btn:hover { background: rgba(24, 24, 27, 0.8); }
        .btn-icon { padding: 16px; height: 56px; width: 56px; }
        .btn svg { width: 22px; height: 22px; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }

        /* Доска и Колонки */
        .board {
            display: flex; gap: 30px; width: 100%; max-width: 1200px; align-items: flex-start; justify-content: center;
        }
        
        .col-wrapper {
            flex: 1; max-width: 580px; display: flex; flex-direction: column; gap: 20px;
        }

        .col-header {
            font-size: 24px; font-weight: 700; color: var(--text-main);
            display: flex; align-items: center; gap: 12px; padding-left: 5px;
        }
        .col-badge {
            background: var(--bg-btn); border: var(--border-glass);
            padding: 4px 12px; border-radius: 12px; font-size: 16px; color: var(--text-muted); font-weight: 600;
        }

        .column {
            display: flex; flex-direction: column; gap: 15px;
            height: 65vh; min-height: 500px; position: relative;
        }

        .task-list {
            display: flex; flex-direction: column; gap: 12px;
            overflow-y: auto; flex-grow: 1; padding-bottom: 40px;
            /* Фейд эффект внизу */
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        /* Карточки */
        .card {
            background: var(--bg-btn); border: var(--border-glass);
            border-radius: var(--radius-main); padding: 20px;
            display: flex; flex-direction: column; gap: 15px; cursor: grab;
            transition: transform 0.2s, background 0.2s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .card:active { cursor: grabbing; }
        .card:hover { background: rgba(255, 255, 255, 0.05); }
        .card.dragging { opacity: 0.5; transform: scale(0.98); }
        .card.touch-dragging { transform: scale(1.02); z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-color: var(--accent); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-title { font-size: 18px; font-weight: 600; line-height: 1.3; }
        .card-rating { font-size: 16px; font-weight: 700; color: var(--rating-green); background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 10px; }
        .card-footer { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { font-size: 12px; padding: 6px 12px; border-radius: 12px; background: rgba(255,255,255,0.05); color: var(--text-muted); font-weight: 500; }

        /* Мобильное контекстное меню */
        .context-menu {
            position: fixed; background: #18181b; border: var(--border-glass); border-radius: var(--radius-main);
            padding: 10px; display: none; flex-direction: column; gap: 5px; z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .context-menu.active { display: flex; }
        .context-btn {
            background: none; border: none; color: var(--text-main); padding: 12px 20px;
            border-radius: 12px; font-size: 16px; text-align: left; cursor: pointer; font-weight: 500;
        }
        .context-btn:hover { background: rgba(255,255,255,0.05); }
        .context-btn.danger { color: var(--danger); }

        /* Всплывающие уведомления */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 20px);
            background: var(--bg-btn); border: var(--border-glass); color: var(--text-main);
            padding: 16px 32px; border-radius: var(--radius-main); font-size: 16px; font-weight: 600;
            opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 9999; backdrop-filter: blur(10px);
        }
        .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

        /* Модальные окна */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 5000; display: flex; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .modal-overlay.is-open { opacity: 1; visibility: visible; }
        .modal-box {
            background: #18181b; padding: 40px; border-radius: 32px; width: 100%; max-width: 450px;
            text-align: center; border: var(--border-glass); position: relative;
        }
        .modal-box h2 { font-size: 28px; font-weight: 800; margin-bottom: 25px; }
        .custom-input {
            width: 100%; padding: 20px; font-size: 18px; background: rgba(255,255,255,0.05); border: var(--border-glass);
            border-radius: var(--radius-main); color: var(--text-main); margin-bottom: 15px; outline: none; transition: border 0.2s;
        }
        .custom-input:focus { border-color: var(--accent); }
        .modal-btn {
            width: 100%; padding: 20px; background: var(--accent); color: #000; font-size: 18px; font-weight: 700;
            border: none; border-radius: var(--radius-main); cursor: pointer; transition: opacity 0.2s;
        }
        .modal-btn:hover { opacity: 0.9; }
        .close-modal {
            position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted);
            font-size: 24px; cursor: pointer;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .board { flex-direction: column; }
            .col-wrapper { max-width: 100%; }
            .column { height: auto; min-height: 300px; }
            .task-list { max-height: 50vh; }
            .search-container.expanded { width: 100%; position: absolute; left: 0; right: 0; z-index: 10; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal-box">
            <h2>Вход</h2>
            <input type="text" class="custom-input" id="auth-code" placeholder="Код (5 символов)" maxlength="5" style="text-transform: uppercase; text-align: center; letter-spacing: 5px; font-weight: 700;">
            <input type="text" class="custom-input" id="auth-name" placeholder="Ваше имя">
            <button class="modal-btn" id="save-auth-btn">Войти</button>
        </div>
    </div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal-box">
            <button class="close-modal" id="close-add-modal">✖</button>
            <h2>Новый фильм</h2>
            <input type="text" class="custom-input" id="new-movie-input" placeholder="Название фильма...">
            <button class="modal-btn" id="save-movie-btn">Добавить</button>
        </div>
    </div>

    <div class="context-menu" id="context-menu">
        <button class="context-btn" id="ctx-move">Переместить</button>
        <button class="context-btn danger" id="ctx-delete">Удалить</button>
    </div>

    <header class="app-header">
        <div class="greeting">Привет, <span id="display-name">Гость</span></div>
        <div class="header-controls">
            <div class="search-container" id="search-container">
                <button class="search-trigger" id="search-trigger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Поиск</span>
                </button>
                <input type="text" class="search-input" id="search-input" placeholder="Найти...">
            </div>
            
            <button class="btn btn-icon" onclick="document.getElementById('add-modal').classList.add('is-open'); setTimeout(()=>document.getElementById('new-movie-input').focus(), 100);" title="Добавить фильм">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            
            <button class="btn btn-icon btn-danger" id="clear-btn" title="Очистить всё">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </header>

    <div class="board">
        <div class="col-wrapper">
            <div class="col-header">Буду смотреть <span class="col-badge" id="count-todo">0</span></div>
            <div class="column" id="zone-todo">
                <div class="task-list"></div>
            </div>
        </div>

        <div class="col-wrapper">
            <div class="col-header">Просмотрено <span class="col-badge" id="count-watched">0</span></div>
            <div class="column" id="zone-watched">
                <div class="task-list"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Уведомления ---
        let toastTimeout;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // --- Авторизация ---
        document.getElementById('save-auth-btn').addEventListener('click', () => {
            const code = document.getElementById('auth-code').value.trim().toUpperCase();
            const name = document.getElementById('auth-name').value.trim();
            if (code.length !== 5) return showToast('Код должен быть 5 символов!');
            if (!name) return showToast('Введите имя!');
            
            localStorage.setItem('syncKey', code);
            localStorage.setItem('syncName', name);
            document.getElementById('display-name').textContent = name;
            document.getElementById('auth-modal').classList.remove('is-open');
            showToast('Успешный вход');
            // Если нужно подгрузить данные с Vercel - вызываем функцию загрузки
            if(typeof loadCloudData === 'function') loadCloudData();
        });

        // --- Поиск ---
        const searchContainer = document.getElementById('search-container');
        const searchInput = document.getElementById('search-input');
        document.getElementById('search-trigger').addEventListener('click', () => {
            searchContainer.classList.toggle('expanded');
            if (searchContainer.classList.contains('expanded')) {
                searchInput.focus();
            } else {
                searchInput.value = '';
                filterCards('');
            }
        });
        searchInput.addEventListener('input', (e) => filterCards(e.target.value));

        function filterCards(query) {
            const lower = query.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                card.style.display = title.includes(lower) ? 'flex' : 'none';
            });
        }

        // --- Создание карточек ---
        let deletedMovies = JSON.parse(localStorage.getItem('deletedMovies')) || [];
        
        function updateCounts() {
            document.getElementById('count-todo').textContent = document.getElementById('zone-todo').querySelector('.task-list').children.length;
            document.getElementById('count-watched').textContent = document.getElementById('zone-watched').querySelector('.task-list').children.length;
        }

        function createCard(title, rating = 'Wait') {
            const card = document.createElement('div');
            card.className = 'card';
            card.draggable = true;
            
            const isWatched = rating !== 'Wait';
            const ratingHtml = isWatched ? `<div class="card-rating" style="color: var(--text-muted); background: rgba(255,255,255,0.05);">${rating}/10</div>` : `<div class="card-rating">Wait</div>`;
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${title}</div>
                    ${ratingHtml}
                </div>
                <div class="card-footer">
                    <div class="tag">#Фильм</div>
                </div>
            `;

            // Drag and Drop (Десктоп)
            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                saveCloudData();
            });

            // Touch Drag and Drop (Мобилки - зажатие 1 сек)
            let touchTimer;
            let isDraggingTouch = false;
            
            card.addEventListener('touchstart', (e) => {
                if(e.touches.length > 1) return;
                touchTimer = setTimeout(() => {
                    isDraggingTouch = true;
                    card.classList.add('touch-dragging');
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 1000);
            }, {passive: true});

            card.addEventListener('touchend', () => {
                clearTimeout(touchTimer);
                if (isDraggingTouch) {
                    card.classList.remove('touch-dragging');
                    isDraggingTouch = false;
                    saveCloudData();
                }
            });

            card.addEventListener('touchmove', (e) => {
                if (!isDraggingTouch) {
                    clearTimeout(touchTimer);
                    return;
                }
                e.preventDefault();
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                const closestCard = target?.closest('.card');
                
                if (closestCard && closestCard !== card && closestCard.parentElement === card.parentElement) {
                    const list = card.parentElement;
                    const children = Array.from(list.children);
                    if (children.indexOf(card) < children.indexOf(closestCard)) {
                        closestCard.after(card);
                    } else {
                        closestCard.before(card);
                    }
                }
            }, {passive: false});

            // Контекстное меню (по клику)
            card.addEventListener('click', (e) => {
                if (isDraggingTouch) return; // Игнорируем клик, если это был драг
                showContextMenu(e, card);
            });

            return card;
        }

        // --- Drag & Drop зоны ---
        document.querySelectorAll('.column').forEach(col => {
            const list = col.querySelector('.task-list');
            col.addEventListener('dragover', e => {
                e.preventDefault();
                const dragging = document.querySelector('.dragging');
                if(dragging) list.appendChild(dragging);
            });
        });

        // --- Контекстное меню ---
        const ctxMenu = document.getElementById('context-menu');
        let currentCard = null;

        function showContextMenu(e, card) {
            e.preventDefault();
            currentCard = card;
            ctxMenu.style.left = `${e.clientX}px`;
            ctxMenu.style.top = `${e.clientY}px`;
            ctxMenu.classList.add('active');
            
            const btnMove = document.getElementById('ctx-move');
            const isInTodo = card.closest('#zone-todo');
            btnMove.textContent = isInTodo ? 'В Просмотрено' : 'В Буду смотреть';
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.card') && !e.target.closest('.context-menu')) {
                ctxMenu.classList.remove('active');
            }
        });

        document.getElementById('ctx-move').addEventListener('click', () => {
            if (!currentCard) return;
            const targetList = currentCard.closest('#zone-todo') 
                ? document.getElementById('zone-watched').querySelector('.task-list') 
                : document.getElementById('zone-todo').querySelector('.task-list');
            
            targetList.appendChild(currentCard);
            ctxMenu.classList.remove('active');
            saveCloudData();
        });

        document.getElementById('ctx-delete').addEventListener('click', () => {
            if (!currentCard) return;
            deletedMovies.push(currentCard.querySelector('.card-title').textContent);
            localStorage.setItem('deletedMovies', JSON.stringify(deletedMovies));
            currentCard.remove();
            ctxMenu.classList.remove('active');
            saveCloudData();
            showToast('Удалено');
        });

        // --- Добавление фильма ---
        document.getElementById('close-add-modal').addEventListener('click', () => {
            document.getElementById('add-modal').classList.remove('is-open');
        });

        document.getElementById('save-movie-btn').addEventListener('click', () => {
            const input = document.getElementById('new-movie-input');
            const val = input.value.trim();
            if(val) {
                document.getElementById('zone-todo').querySelector('.task-list').appendChild(createCard(val));
                input.value = '';
                document.getElementById('add-modal').classList.remove('is-open');
                saveCloudData();
                showToast('Добавлено');
            }
        });

        // --- Логика сохранения (Vercel + Local) ---
        function getBoardData() {
            const data = { 'zone-todo': [], 'zone-watched': [] };
            document.querySelectorAll('.column').forEach(col => {
                const id = col.id;
                col.querySelectorAll('.card').forEach(c => {
                    const title = c.querySelector('.card-title').textContent;
                    const rating = c.querySelector('.card-rating').textContent.replace('/10', '');
                    data[id].push({ title, rating });
                });
            });
            return data;
        }

        function saveCloudData() {
            updateCounts();
            const data = getBoardData();
            localStorage.setItem('boardData', JSON.stringify(data));
            const key = localStorage.getItem('syncKey');
            if (!key) return;

            fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, boardData: data, deletedMovies })
            }).catch(e => console.log('Локальное сохранение', e));
        }

        function loadBoardFromStorage() {
            const saved = JSON.parse(localStorage.getItem('boardData'));
            if (saved) {
                document.querySelectorAll('.task-list').forEach(l => l.innerHTML = '');
                Object.keys(saved).forEach(z => {
                    const list = document.getElementById(z)?.querySelector('.task-list');
                    if(list) saved[z].forEach(obj => list.appendChild(createCard(obj.title, obj.rating)));
                });
            }
            updateCounts();
        }

        async function loadCloudData() {
            const key = localStorage.getItem('syncKey');
            if (!key) return;
            try {
                const res = await fetch(`/api/load?key=${key}`);
                if (res.ok) {
                    const cloudData = await res.json();
                    localStorage.setItem('boardData', JSON.stringify(cloudData.boardData));
                    deletedMovies = cloudData.deletedMovies || [];
                    localStorage.setItem('deletedMovies', JSON.stringify(deletedMovies));
                    loadBoardFromStorage();
                }
            } catch (e) {
                console.log('Работаем локально, нет сети.');
            }
        }

        // Очистка с зажатием
        const clearBtn = document.getElementById('clear-btn');
        let holdTimer;
        clearBtn.addEventListener('mousedown', () => { holdTimer = setTimeout(() => { document.querySelectorAll('.task-list').forEach(l => l.innerHTML = ''); deletedMovies = []; localStorage.removeItem('deletedMovies'); saveCloudData(); showToast('Всё очищено!'); }, 2000); });
        clearBtn.addEventListener('mouseup', () => clearTimeout(holdTimer));
        clearBtn.addEventListener('mouseleave', () => clearTimeout(holdTimer));
        clearBtn.addEventListener('touchstart', () => { holdTimer = setTimeout(() => { document.querySelectorAll('.task-list').forEach(l => l.innerHTML = ''); deletedMovies = []; localStorage.removeItem('deletedMovies'); saveCloudData(); showToast('Всё очищено!'); }, 2000); });
        clearBtn.addEventListener('touchend', () => clearTimeout(holdTimer));

        // Инициализация
        window.onload = () => {
            const name = localStorage.getItem('syncName');
            const key = localStorage.getItem('syncKey');
            if (name) document.getElementById('display-name').textContent = name;
            
            if (!key) {
                document.getElementById('auth-modal').classList.add('is-open');
            } else {
                loadBoardFromStorage();
                loadCloudData();
            }
        };
    </script>
</body>
</html>
